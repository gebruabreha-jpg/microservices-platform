receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: normal
  # base URL only - the exporter appends /v1/traces itself
  otlphttp/tempo:
    endpoint: http://tempo:4318

service:
  telemetry:
    logs:
      level: info
  pipelines:
    # Metrics do NOT go through the collector: each service exposes /metrics and
    # Prometheus scrapes it directly.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

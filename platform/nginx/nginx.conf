events {
    worker_connections 1024;
}

http {
    upstream order-service {
        server order-service:8080;
    }

    upstream inventory-service {
        server inventory-service:8080;
    }

    upstream payment-service {
        server payment-service:8080;
    }

    upstream notification-service {
        server notification-service:8080;
    }

    server {
        listen 80 default_server;

        location / {
            return 200 '{"status":"ok","service":"nginx-gateway","endpoints":["/orders","/inventory","/payments","/notifications","/health","/metrics"]}';
            add_header Content-Type application/json;
        }

        location /orders {
            proxy_pass http://order-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /inventory {
            proxy_pass http://inventory-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /payments {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /notifications {
            proxy_pass http://notification-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://order-service;
            proxy_set_header Host $host;
        }

        location /metrics {
            proxy_pass http://order-service;
            proxy_set_header Host $host;
        }
    }
}
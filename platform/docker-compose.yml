# Infrastructure stack for the microservices platform
# All services share the platform-net bridge network for inter-service DNS resolution
# Volumes are declared at the bottom and referenced by name in each service

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d  # SQL init scripts run on first start
      - postgres_data:/var/lib/postgresql/data        # persistent DB storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes           # enable AOF persistence
    volumes:
      - redis_data:/data                             # persistent cache storage
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"                                      # API Gateway entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # custom routing config
    depends_on:
      - postgres
      - redis
    networks:
      - platform-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - platform-net                                # Kafka dependency

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - platform-net

  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.5.0
    environment:
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082     # HTTP proxy for Kafka topics
    depends_on:
      - kafka
    networks:
      - platform-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"                                  # AMQP protocol
      - "15672:15672"                                # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json  # auto-create queues
      - rabbitmq_data:/var/lib/rabbitmq   # persistent message storage
    networks:
      - platform-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # scrape targets
      - prometheus_data:/prometheus                  # time-series DB storage
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - platform-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana               # dashboard settings
      - ./grafana/provisioning:/etc/grafana/provisioning:ro  # auto-configure datasources
      - ./grafana/dashboards:/etc/grafana/dashboards:ro      # pre-built dashboards
    networks:
      - platform-net

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command:
      - '-config.file=/etc/loki/config.yml'
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki                             # log storage
    networks:
      - platform-net

  tempo:
    image: grafana/tempo:2.4.0
    ports:
      - "3200:3200"                                  # HTTP traces API
      - "9411:9411"                                  # gRPC traces API
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo                       # trace storage
    networks:
      - platform-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    ports:
      - "4317:4317"                                  # OTLP gRPC
      - "4318:4318"                                  # OTLP HTTP
      - "8889:8889"                                  # Prometheus metrics exporter
    command:
      - '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - platform-net

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro                         # host process metrics
      - /sys:/host/sys:ro                           # host sys metrics
      - /:/rootfs:ro                                # host filesystem metrics
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - platform-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro                                # container filesystem metrics
      - /var/run:/var/run:ro                        # Docker socket
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - platform-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - platform-net

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    networks:
      - platform-net

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localdomain.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin               # saved server connections
    networks:
      - platform-net

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"                                  # SMTP server
      - "8025:8025"                                  # Web UI
    networks:
      - platform-net

# Named volumes for persistent data
# Docker manages these — data survives container restarts
# Named volumes declared once here and referenced by name in each service above
# Docker manages the volume lifecycle — data persists across container restarts
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:

# Network declared once here and referenced by name in each service above
# name: platform-net ensures external compose files (services/, traffic-generator/) can attach
# driver: bridge creates an isolated L2 network for inter-container DNS resolution
networks:
  platform-net:
    name: platform-net
    driver: bridge

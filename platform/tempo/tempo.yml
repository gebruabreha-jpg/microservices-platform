server:
  http_listen_port: 3200
  grpc_listen_port: 9411

distributor:
  zone_ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    address: 0.0.0.0
    port: 7946
    join_after: 1s
    keep_alive: 1s
    claim_period: 5s
    observable_period: 1s
    min_ready_duration: 1s

compactor:
  working_directory: /tmp/tempo/compactor
  shared_store: filesystem

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      dir: /tmp/tempo/wal

querier:
  search:
    max_concurrent: 10

frontend:
  http:
    listen_port: 3200

target:
  - all

version: '3.8'

services:
  locust:
    build:
      context: ..
      dockerfile: traffic-generator/Dockerfile
    ports:
      - "8089:8089"
    environment:
      LOCUST_HOST: http://nginx
      LOCUST_USERS: "${LOCUST_USERS:-100}"
      LOCUST_SPAWN_RATE: "${LOCUST_SPAWN_RATE:-10}"
      LOCUST_RUN_TIME: "${LOCUST_RUN_TIME:-5m}"
    volumes:
      - ./results:/results
    networks:
      - platform-net

networks:
  platform-net:
    external: true
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microservices-platform-tls
  namespace: default
spec:
  secretName: microservices-platform-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: example.com
  dnsNames:
    - example.com
    - "*.example.com"
  duration: 2160h
  renewBefore: 360h

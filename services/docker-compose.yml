version: '3.8'

services:
  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_REST_URL: http://kafka-rest:8082
    depends_on:
      - postgres
      - redis
      - kafka-rest

  inventory-service:
    build:
      context: ..
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    depends_on:
      - postgres

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: secret
    depends_on:
      - postgres
      - rabbitmq

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: secret
    depends_on:
      - postgres
      - rabbitmq

  traffic-generator:
    build:
      context: ..
      dockerfile: services/traffic-generator/Dockerfile
    ports:
      - "8089:8089"
    environment:
      LOCUST_HOST: http://nginx
      LOCUST_USERS: "${LOCUST_USERS:-100}"
      LOCUST_SPAWN_RATE: "${LOCUST_SPAWN_RATE:-10}"
      LOCUST_RUN_TIME: "${LOCUST_RUN_TIME:-5m}"
    depends_on:
      - nginx